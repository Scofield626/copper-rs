[package]
name = "cu-anytime-rrt-star"
description = "Anytime RRT* planner example built on the cu29 Anytime trait."
version.workspace = true
authors.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
keywords.workspace = true
categories.workspace = true
homepage.workspace = true
repository.workspace = true

publish = false

[[bin]]
name = "cu-anytime-rrt-star"
path = "src/main.rs"

[features]
default = []
determinism_ci = ["cu29-export"]

[dependencies]
cu29 = { workspace = true }
cu29-export = { workspace = true, optional = true }
cu-rng = { workspace = true }
serde = { workspace = true }
bincode = { workspace = true }

[package.metadata.cargo-shear]
ignored = ["serde", "bincode"]
